[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pddikti-sdk"
version = "0.2.0"
description = "SDK Modern & Type-Safe untuk Data Pendidikan Tinggi Indonesia (PDDikti, SINTA, Akreditasi BAN-PT/LAM, dan Analisis Rasio Dosen-Mahasiswa)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "banghamid", email = "62824084+banghamid@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
pddikti = "pddikti_sdk.cli:main"
pddikti-cli = "pddikti_sdk.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/banghamid/pddikti_sdk"
Repository = "https://github.com/banghamid/pddikti_sdk.git"
Issues = "https://github.com/banghamid/pddikti_sdk/issues"
